        * {

            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: #fafafa;
            color: #18181b;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem 1rem;
        }

        /* Split-Panel Corporate Form Blueprint */
        .enterprise-container {
            display: grid;
            grid-template-columns: 1.15fr 0.85fr;
            max-width: 1200px;
            width: 100%;
            min-height: 680px;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.05);
            overflow: hidden;
            border: 1px solid #e4e4e7;
        }

        /* Left Brand Profile Showcase Segment */
        .brand-panel {
            background-color: #09090b;
            color: #ffffff;
            padding: 3.5rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
        }

        .corporate-logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 1.25rem;
            font-weight: 600;
            letter-spacing: -0.025em;
        }

        .logo-icon {
            width: 28px;
            height: 28px;
            color: #3b82f6;
        }

        .brand-content h2 {
            font-size: 2.25rem;
            font-weight: 700;
            line-height: 1.2;
            margin-bottom: 1.25rem;
            letter-spacing: -0.03em;
        }

        .brand-content p {
            color: #a1a1aa;
            font-size: 1.05rem;
            line-height: 1.6;
            max-width: 460px;
        }

        .corporate-footer-features {
            display: flex;
            gap: 2rem;
        }

        .feature-badge {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.875rem;
            color: #a1a1aa;
        }

        .feature-badge svg {
            width: 16px;
            height: 16px;
            color: #22c55e;
        }

        /* Right Side: Interactive Commercial Auth Panel Segment */
        .auth-panel {
            padding: 3.5rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background: #ffffff;
        }

        .auth-view {
            display: none;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .auth-view.active-view {
            display: block;
            opacity: 1;
        }

        .auth-header {
            margin-bottom: 2.5rem;
        }

        .auth-header h1 {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.03em;
            margin-bottom: 0.5rem;
        }

        .auth-header p {
            color: #71717a;
            font-size: 0.95rem;
        }

        .auth-header span {
            color: #2563eb;
            cursor: pointer;
            font-weight: 500;
            text-decoration: underline;
            text-underline-offset: 4px;
        }

        .corporate-form {
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        .form-row {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .form-row input {
            width: 100%;
            padding: 0.875rem 1rem;
            border: 1px solid #e4e4e7;
            border-radius: 8px;
            font-size: 0.95rem;
            background-color: #fafafa;
            transition: all 0.2s ease;
        }

        .form-row input:focus {
            outline: none;
            border-color: #2563eb;
            background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
        }

        .field-error-msg {
            display: none;
            color: #ef4444;
            font-size: 0.8rem;
            margin-left: 0.25rem;
        }

        .form-row.has-error .field-error-msg {
            display: block;
        }

        .form-row.has-error input {
            border-color: #ef4444;
            background-color: #fef2f2;
        }

        .legal-row {
            display: flex;
            align-items: flex-start;
            gap: 0.75rem;
            margin: 0.5rem 0;
        }

        .legal-row input[type="checkbox"] {
            margin-top: 0.25rem;
            cursor: pointer;
        }

        .legal-row label {
            font-size: 0.85rem;
            color: #71717a;
            line-height: 1.4;
        }

        .legal-row span {
            color: #2563eb;
            cursor: pointer;
            text-decoration: underline;
        }

        .btn-submit {
            width: 100%;
            padding: 0.875rem;
            background-color: #18181b;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            transition: background-color 0.2s ease;
        }

        .btn-submit:hover:not(:disabled) {
            background-color: #27272a;
        }

        .btn-submit:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .btn-sso {
            width: 100%;
            padding: 0.875rem;
            background-color: #ffffff;
            color: #18181b;
            border: 1px solid #e4e4e7;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            transition: background-color 0.2s ease;
        }

        .btn-sso:hover {
            background-color: #f4f4f5;
        }

        .brand-vector {
            width: 18px;
            height: 18px;
        }

        .auth-divider {
            display: flex;
            align-items: center;
            text-align: center;
            color: #a1a1aa;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin: 1.5rem 0;
        }

        .auth-divider::before, .auth-divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #e4e4e7;
        }

        .auth-divider:not(:empty)::before { margin-right: 1rem; }
        .auth-divider:not(:empty)::after { margin-left: 1rem; }

        /* Notification Engine Components */
        .system-toast {
            position: fixed;
            top: 2rem;
            right: 2rem;
            background-color: #ffffff;
            border: 1px solid #27272a;
            padding: 1rem 1.25rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            transform: translateX(150%);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .system-toast.toast-visible {
            transform: translateX(0);
        }

        /* Loading Spinner Component */
        .spinner {
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #ffffff;
            animation: spin 0.6s linear infinite;
            display: none;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Component: Modal Window Framework */
        .legal-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(9, 9, 11, 0.4);
            backdrop-filter: blur(4px);
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }

        .legal-modal-overlay.modal-open {
            opacity: 1;
            pointer-events: auto;
        }

        .legal-modal-window {
            background: #ffffff;
            width: 100%;
            max-width: 550px;

            border: 1px solid #e4e4e7;
            transform: scale(0.95);
            transition: transform 0.2s ease;
        }

        .legal-modal-overlay.modal-open .legal-modal-window {
            transform: scale(1);
        }

        .legal-modal-window h3 {
            font-size: 1.5rem;
            margin-bottom: 1rem;
            letter-spacing: -0.02em;
        }

        .legal-modal-window p {
            font-size: 0.95rem;
            color: #71717a;
            line-height: 1.6;
            margin-bottom: 1.5rem;
        }

        /* Adaptive Responsiveness for Portable Devices */
        @media (max-width: 1024px) {

                grid-template-columns: 1fr;
            }

                padding: 3rem 2.5rem;
