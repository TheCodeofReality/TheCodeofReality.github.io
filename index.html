<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Portfolio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <section class="hero">
        <div class="container">
            <div class="hero-text">
    <h1>Create Your Account</h1>
    <p>Join us today. It takes less than a minute to set up your professional profile.</p>
    
    <!-- Pro Sign-Up Form -->
    <form class="signup-form">
        <div class="form-group">
            <input type="text" placeholder="Full Name" required autocomplete="name">
        </div>
        <div class="form-group">
            <input type="email" placeholder="Email Address" required autocomplete="email">
        </div>
        <div class="form-group">
            <input type="password" placeholder="Password" required autocomplete="new-password">
        </div>
        
        <!-- Easy Terms and Conditions Checkbox -->
        <div class="terms-group">
            <input type="checkbox" id="terms" required>
            <label for="terms">I accept the <a href="#">Terms & Conditions</a> and <a href="#">Privacy Policy</a></label>
        </div>
        
        <button type="submit" class="btn-submit">Sign Up Easily</button>
    </form>
</div>

                <h1>Hello, I'm a Creator</h1>
                <p>Welcome to my professional space. I build modern, clean, and impactful digital experiences.</p>
                <a href="#" class="btn">View My Work</a>
            </div>
            <div class="hero-image">
                <!-- Ensure your image name matches the file you upload -->
                <img src="hero-pic.jpg" alt="Professional Showcase">
            </div>
        </div>
    </section>
</body>
</html>
