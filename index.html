<!DOCTYPE html>
<html lang="en">
<head>

    <title>Professional Portfolio</title>

<body>
    <section class="hero">
        <div class="container">
            <div class="hero-text">
    <h1>Create Your Account</h1>
    <p>Join us today. It takes less than a minute to set up your professional profile.</p>
    
    <!-- Pro Sign-Up Form -->
    <form class="signup-form">
        <div class="form-group">
            <input type="text" placeholder="Full Name" required autocomplete="name">
        </div>
        <div class="form-group">
            <input type="email" placeholder="Email Address" required autocomplete="email">
        </div>
        <div class="form-group">
            <input type="password" placeholder="Password" required autocomplete="new-password">
        </div>
        
        <!-- Easy Terms and Conditions Checkbox -->
        <div class="terms-group">
            <input type="checkbox" id="terms" required>
            <label for="terms">I accept the <a href="#">Terms & Conditions</a> and <a href="#">Privacy Policy</a></label>
        </div>
        
        <button type="submit" class="btn-submit">Sign Up Easily</button>
    </        <button type="submit" class="btn-submit">Sign Up Easily</button>

        <button type="button" class="btn-parmessh">
            <!-- Professional modern icon abstract representation -->
            <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
            </svg>
            Sign in with Parmessh Corp
        </button>
    </form>
